global:
  metadata: {}
  # -- Pod-level security defaults, merged with each component's podSecurityContext.
  podSecurityContext: {}
  container:
    image:
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 200m
        memory: 256M
        ephemeralStorage: 1Gi
      limits:
        cpu: 200m
        memory: 256M
        ephemeralStorage: 1Gi
    envs:
      values: {}
      from:
        secrets: []
        configMaps: []
  nodeSelector: {}
  rollingUpdate:
    maxUnavailable: 0%
    maxSurge: 100%
  service:
    type: ClusterIP

externalSecrets: {}
