apiVersion: v2
name: complex
description: For deploying applications with consumers and cronjobs
type: application
version: 1.14.2
kubeVersion: ">= 1.25.0-0 < 2.0.0-0"
home: https://github.com/cookielab/helm-charts/tree/main/complex
sources:
  - https://github.com/cookielab/helm-charts
maintainers:
  - name: Cookielab
    url: https://github.com/cookielab
keywords:
  - application
  - deployment
  - workers
  - cronjob
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: integration-delivery
  artifacthub.io/links: |
    - name: support
      url: https://github.com/cookielab/helm-charts/issues
  artifacthub.io/changes: |
    - kind: added
      description: Add Artifact Hub package metadata and a complete installation example.
    - kind: added
      description: License the charts under MIT and include the license in the Complex package.

dependencies:
  - name: lib-gitlab
    version: "0.1.0"
    repository: "file://../lib-gitlab"
  - name: lib-kubernetes
    version: "0.5.1"
    repository: "file://../lib-kubernetes"
  - name: lib-prometheus
    version: "0.1.7"
    repository: "file://../lib-prometheus"
