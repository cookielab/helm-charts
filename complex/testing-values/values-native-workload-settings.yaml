global:
  podSecurityContext:
    runAsNonRoot: true
  container:
    image:
      repository: cookielab/deployer
      tag: 1.0.0-rc2

components:
  worker:
    type: http-internal
    replicas: 1
    ports:
      - name: runner
        port: 3443
        servicePort: 443
        targetPort: runner
    podSecurityContext:
      fsGroup: 1000
    securityContext:
      runAsUser: 1000
    annotations:
      secrets.infisical.com/auto-reload: "true"
    envs:
      from:
        secrets: [worker-envs]
    probes:
      readinessProbe:
        httpGet:
          port: runner
          path: /ready
      livenessProbe:
        httpGet:
          port: runner
          path: /health
