{{- range $componentName, $component := .Values.components }}
{{- if and (eq $component.type "consumer") (hasKey $component "keda") }}
{{- $keda := $component.keda }}
{{- $name := include "component.name" (dict "name" $componentName "Release" $.Release) }}
{{- $scaledObjectName := $keda.scaledObjectName | default (printf "%s-scaler" $name) }}
{{- $maxScaledObjectNameLength := sub 63 (len "keda-hpa-") }}
{{- if gt (len $scaledObjectName) $maxScaledObjectNameLength }}
  {{- fail (printf "KEDA ScaledObject name '%s' must be no more than %d characters because KEDA generates an HPA named 'keda-hpa-<scaledobject-name>'. Set 'keda.scaledObjectName' on component '%s' to override it." $scaledObjectName $maxScaledObjectNameLength $componentName) }}
{{- end }}

---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $scaledObjectName }}
spec:
  scaleTargetRef:
    name: {{ $name }}
  minReplicaCount: {{ $keda.minReplicaCount | default 0 }}
  maxReplicaCount: {{ $keda.maxReplicaCount | default 2 }}
  pollingInterval: {{ $keda.pollingInterval | default 15 }}
  cooldownPeriod: {{ $keda.cooldownPeriod | default 30 }}
  triggers:
  {{- range $i, $trigger := $keda.triggers }}
    {{- if eq $trigger.type "kafka" }}
      {{- $identityOwner := $trigger.identityOwner | default "operator" }}
      {{- $awsRegion := $trigger.awsRegion | default (dig "keda" "awsRegion" "" $.Values.global) }}
      {{- if and (eq $identityOwner "operator") (not $awsRegion) }}
        {{- fail (printf "Kafka trigger for '%s' uses identityOwner=operator (aws_msk_iam SASL) and requires 'awsRegion' (set on the trigger or global.keda.awsRegion)." $componentName) }}
      {{- end }}
    - type: kafka
      metadata:
        activationLagThreshold: {{ $trigger.activationLagThreshold | default "0" | quote }}
        bootstrapServers: {{ $trigger.bootstrapServers | quote }}
        consumerGroup: {{ $trigger.consumerGroup | quote }}
        offsetResetPolicy: {{ $trigger.offsetResetPolicy | default "earliest" }}
        {{- if $trigger.topic }}
        topic: {{ $trigger.topic | quote }}
        {{- end }}
        identityOwner: {{ $identityOwner | quote }}
        tls: "enable"
        lagThreshold: {{ $trigger.lagThreshold | quote }}
        {{- if eq $identityOwner "operator" }}
        awsRegion: {{ $awsRegion | quote }}
        sasl: oauthbearer
        saslTokenProvider: aws_msk_iam
        {{- end }}

    {{- else if eq $trigger.type "aws-sqs-queue" }}
      {{- $awsRegion := $trigger.awsRegion | default (dig "keda" "awsRegion" "" $.Values.global) }}
      {{- if (not $awsRegion) }}
        {{- fail (printf "SQS trigger for '%s' is missing required field 'awsRegion' (set on the trigger or global.keda.awsRegion)." $componentName) }}
      {{- end }}
    - type: aws-sqs-queue
      {{ if not (eq ($trigger.identityOwner | default "operator") "operator") -}}
      authenticationRef:
        name: {{ $name }}-auth-{{ $i }}
      {{ end -}}
      metadata:
        activationQueueLength: {{ $trigger.activationQueueLength | default "0" | quote }}
        awsRegion: {{ $awsRegion | quote }}
        identityOwner: {{ $trigger.identityOwner | default "operator" | quote }}
        queueLength: {{ $trigger.queueLength | quote }}
        queueURLFromEnv: {{ $trigger.queueURLFromEnv | quote }}

    {{- else if eq $trigger.type "cron" }}
    - type: cron
      metadata:
        desiredReplicas: {{ $trigger.desiredReplicas | quote }}
        timezone: {{ $trigger.timezone | quote }}
        start: {{ $trigger.start | quote }}
        end: {{ $trigger.end | quote }}

    {{- else if eq $trigger.type "prometheus" }}
      {{- if not $trigger.serverAddress }}
        {{- fail (printf "Prometheus trigger for '%s' is missing required field 'serverAddress'." $componentName) }}
      {{- end }}
      {{- if and (not $trigger.metricName) (not $trigger.query) }}
        {{- fail (printf "Prometheus trigger for '%s' must have either 'metricName' or 'query'." $componentName) }}
      {{- end }}
      {{- if not $trigger.threshold }}
        {{- fail (printf "Prometheus trigger for '%s' is missing required field 'threshold'." $componentName) }}
      {{- end }}
    - type: prometheus
      metadata:
        serverAddress: {{ $trigger.serverAddress | quote }}
        threshold: {{ $trigger.threshold }}
        {{- if $trigger.metricName }}
        metricName: {{ $trigger.metricName | quote }}
        {{- end }}
        {{- if $trigger.query }}
        query: {{ $trigger.query | quote }}
        {{- end }}
        {{- if $trigger.activationThreshold }}
        activationThreshold: {{ $trigger.activationThreshold }}
        {{- end }}
        {{- if $trigger.ignoreNullValues }}
        ignoreNullValues: {{ $trigger.ignoreNullValues | quote }}
        {{- end }}
        {{- if $trigger.unsafeSsl }}
        unsafeSsl: {{ $trigger.unsafeSsl | quote }}
        {{- end }}
        {{- if $trigger.customHeaders }}
        customHeaders: {{ $trigger.customHeaders | quote }}
        {{- end }}
        {{- if $trigger.namespace }}
        namespace: {{ $trigger.namespace | quote }}
        {{- end }}
        {{- if $trigger.queryParameters }}
        queryParameters: {{ $trigger.queryParameters | quote }}
        {{- end }}

    {{- else if eq $trigger.type "postgresql" }}
      {{- if not $trigger.query }}
        {{- fail (printf "PostgreSQL trigger for '%s' is missing required field 'query'." $componentName) }}
      {{- end }}
      {{- if not $trigger.targetQueryValue }}
        {{- fail (printf "PostgreSQL trigger for '%s' is missing required field 'targetQueryValue'." $componentName) }}
      {{- end }}
      {{- $modes := list }}
      {{- if $trigger.connectionFromEnv }}{{- $modes = append $modes "connectionFromEnv" }}{{- end }}
      {{- if $trigger.connectionFromSecret }}{{- $modes = append $modes "connectionFromSecret" }}{{- end }}
      {{- if $trigger.host }}{{- $modes = append $modes "host" }}{{- end }}
      {{- if ne (len $modes) 1 }}
        {{- fail (printf "PostgreSQL trigger for '%s' must set exactly one of 'connectionFromEnv', 'connectionFromSecret' or 'host' (got: %s)." $componentName (ternary "none" (join ", " $modes) (eq (len $modes) 0))) }}
      {{- end }}
      {{- if $trigger.host }}
        {{- $passwordModes := list }}
        {{- if $trigger.passwordFromEnv }}{{- $passwordModes = append $passwordModes "passwordFromEnv" }}{{- end }}
        {{- if $trigger.passwordFromSecret }}{{- $passwordModes = append $passwordModes "passwordFromSecret" }}{{- end }}
        {{- if ne (len $passwordModes) 1 }}
          {{- fail (printf "PostgreSQL trigger for '%s' uses discrete connection fields and must set exactly one of 'passwordFromEnv' or 'passwordFromSecret'." $componentName) }}
        {{- end }}
        {{- /* KEDA's postgresql scaler rejects a ScaledObject with "no sslmode given" when the
               connection is assembled from discrete fields, so sslmode is required here too. */}}
        {{- range $required := list "port" "userName" "dbName" "sslmode" }}
          {{- if not (index $trigger $required) }}
            {{- fail (printf "PostgreSQL trigger for '%s' uses discrete connection fields and is missing '%s'." $componentName $required) }}
          {{- end }}
        {{- end }}
      {{- else }}
        {{- /* The discrete fields are only rendered in host mode; setting them alongside a
               connection string would drop them silently. */}}
        {{- $strayFields := list }}
        {{- range $field := list "port" "userName" "dbName" "sslmode" "passwordFromEnv" "passwordFromSecret" }}
          {{- if index $trigger $field }}{{- $strayFields = append $strayFields $field }}{{- end }}
        {{- end }}
        {{- if $strayFields }}
          {{- fail (printf "PostgreSQL trigger for '%s' uses '%s' and must not set '%s': those fields only apply alongside 'host'." $componentName (first $modes) (join "', '" $strayFields)) }}
        {{- end }}
      {{- end }}
    - type: postgresql
      {{- if or $trigger.connectionFromSecret $trigger.passwordFromSecret }}
      authenticationRef:
        name: {{ $name }}-auth-{{ $i }}
      {{- end }}
      metadata:
        query: {{ $trigger.query | quote }}
        targetQueryValue: {{ $trigger.targetQueryValue | quote }}
        activationTargetQueryValue: {{ $trigger.activationTargetQueryValue | default 0 | quote }}
        {{- if $trigger.connectionFromEnv }}
        connectionFromEnv: {{ $trigger.connectionFromEnv | quote }}
        {{- end }}
        {{- if $trigger.host }}
        host: {{ $trigger.host | quote }}
        port: {{ $trigger.port | quote }}
        userName: {{ $trigger.userName | quote }}
        dbName: {{ $trigger.dbName | quote }}
        sslmode: {{ $trigger.sslmode | quote }}
        {{- if $trigger.passwordFromEnv }}
        passwordFromEnv: {{ $trigger.passwordFromEnv | quote }}
        {{- end }}
        {{- end }}

    {{- else }}
      {{- fail (printf "Unknown trigger type '%s' in component '%s'" $trigger.type $componentName) }}
    {{- end }}
  {{- end }}

{{- end }}
{{- end }}
