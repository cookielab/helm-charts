suite: External secret resource rendering
release:
  name: test
  namespace: dev
templates:
  - templates/externalSecret.yaml
values:
  - ../testing-values/values-minimal.yaml
tests:
  - it: does not render any ExternalSecret when externalSecrets is unset
    asserts:
      - hasDocuments:
          count: 0

  - it: renders an ExternalSecret from raw spec
    set:
      externalSecrets:
        app-admin-vault-envs:
          kind: ExternalSecret
          spec:
            dataFrom:
              - extract:
                  conversionStrategy: Default
                  decodingStrategy: None
                  key: dev/admin/envs
                  metadataPolicy: None
            refreshInterval: 60s
            secretStoreRef:
              kind: SecretStore
              name: vault-secret-store
            target:
              creationPolicy: Owner
              deletionPolicy: Retain
              name: app-admin-vault-envs
              template:
                engineVersion: v2
                mergePolicy: Replace
                metadata:
                  annotations:
                    managed: ExternalSecretsOperator
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: apiVersion
          value: external-secrets.io/v1
      - equal:
          path: metadata.name
          value: app-admin-vault-envs
      - equal:
          path: metadata.namespace
          value: dev
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: external-secret
      - equal:
          path: spec.secretStoreRef.name
          value: vault-secret-store
      - equal:
          path: spec.dataFrom[0].extract.key
          value: dev/admin/envs
      - equal:
          path: spec.target.creationPolicy
          value: Owner
      - equal:
          path: spec.target.template.metadata.annotations.managed
          value: ExternalSecretsOperator

  - it: supports apiVersion and metadata overrides while preserving raw spec templates
    set:
      externalSecrets:
        envs:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          name: "{{ .Release.Name }}-envs"
          namespace: custom
          labels:
            owner: platform
          annotations:
            source: helm
          spec:
            dataFrom:
              - extract:
                  key: "{{ .Release.Namespace }}/admin/envs"
            secretStoreRef:
              kind: ClusterSecretStore
              name: vault
            target:
              creationPolicy: Merge
              name: "{{ .Release.Name }}-envs"
              template:
                engineVersion: v2
                data:
                  connection: "postgres://{{ .username }}:{{ .password }}@postgres"
    asserts:
      - equal:
          path: apiVersion
          value: external-secrets.io/v1
      - equal:
          path: metadata.name
          value: test-envs
      - equal:
          path: metadata.namespace
          value: custom
      - equal:
          path: metadata.labels.owner
          value: platform
      - equal:
          path: metadata.annotations.source
          value: helm
      - equal:
          path: spec.dataFrom[0].extract.key
          value: "{{ .Release.Namespace }}/admin/envs"
      - equal:
          path: spec.target.creationPolicy
          value: Merge
      - equal:
          path: spec.target.name
          value: "{{ .Release.Name }}-envs"
      - equal:
          path: spec.target.template.data.connection
          value: "postgres://{{ .username }}:{{ .password }}@postgres"

  - it: renders a HashiCorp VaultStaticSecret by default
    set:
      externalSecrets:
        app-admin-vault-envs:
          spec:
            destination:
              create: true
              name: app-admin-vault-envs
              overwrite: false
            hmacSecretData: true
            mount: kv2/appio_dev1
            path: robe/xcc_admin
            refreshAfter: 300s
            type: kv-v2
            vaultAuthRef: vault-default-auth
    asserts:
      - isKind:
          of: VaultStaticSecret
      - equal:
          path: apiVersion
          value: secrets.hashicorp.com/v1beta1
      - equal:
          path: spec.destination.name
          value: app-admin-vault-envs
      - equal:
          path: spec.mount
          value: kv2/appio_dev1
      - equal:
          path: spec.path
          value: robe/xcc_admin
      - equal:
          path: spec.vaultAuthRef
          value: vault-default-auth

  - it: skips disabled ExternalSecret entries
    set:
      externalSecrets:
        app-admin-vault-envs:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders an Infisical InfisicalSecret with its default apiVersion
    set:
      externalSecrets:
        app-infisical-envs:
          kind: InfisicalSecret
          spec:
            syncConfig:
              resyncInterval: 60s
            authentication:
              kubernetesAuth:
                identityId: 00000000-0000-0000-0000-000000000000
                autoCreateServiceAccountToken: true
                serviceAccountRef:
                  name: app-infisical
                  namespace: dev
                secretsScope:
                  projectSlug: app-slug
                  envSlug: dev
                  secretsPath: /
            managedKubeSecretReferences:
              - secretName: app-infisical-envs
                secretNamespace: dev
                creationPolicy: Owner
    asserts:
      - isKind:
          of: InfisicalSecret
      - equal:
          path: apiVersion
          value: secrets.infisical.com/v1alpha1
      - equal:
          path: metadata.name
          value: app-infisical-envs
      - equal:
          path: metadata.namespace
          value: dev
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: external-secret
      - equal:
          path: spec.authentication.kubernetesAuth.serviceAccountRef.name
          value: app-infisical
      - equal:
          path: spec.authentication.kubernetesAuth.secretsScope.projectSlug
          value: app-slug
      - equal:
          path: spec.managedKubeSecretReferences[0].secretName
          value: app-infisical-envs

  - it: lets an InfisicalSecret pin a newer apiVersion
    set:
      externalSecrets:
        app-infisical-envs:
          kind: InfisicalSecret
          apiVersion: secrets.infisical.com/v1beta1
          spec:
            infisicalAuthRef:
              name: app-infisical-auth
    asserts:
      - isKind:
          of: InfisicalSecret
      - equal:
          path: apiVersion
          value: secrets.infisical.com/v1beta1

  - it: rejects an unsupported secret resource kind
    set:
      externalSecrets:
        app-envs:
          kind: SealedSecret
          spec:
            encryptedData: {}
    asserts:
      - failedTemplate:
          errorPattern: "(must be one of the following|value must be one of)"
